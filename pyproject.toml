[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "popular-rules-icon"
version = "0.1.0"
description = "Popular-Rules-Icon 6.0 core"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0",
  "cairosvg>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
