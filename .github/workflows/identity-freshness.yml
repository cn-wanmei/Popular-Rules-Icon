name: Identity Freshness

on:
  schedule:
    # Every 4h so post-Collect index drift is reconciled before next Publish
    - cron: "0 */4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [collection-identity-changed]

env:
  PYTHON_VERSION: "3.12"

# Serialize scheduled and repository-dispatch reconciliation. Otherwise two
# drift observations can create competing snapshot PRs for the same index.
concurrency:
  group: icon-identity-freshness
  cancel-in-progress: false

jobs:
  compare:
    name: Compare Collection identity vs pinned snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.compare.outputs.drift }}
      collection_sha: ${{ steps.compare.outputs.collection_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Collection HEAD and fetch index
        run: |
          set -euo pipefail
          mkdir -p /tmp/collection
          SHA=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "User-Agent: icon-freshness" \
            "https://api.github.com/repos/cn-wanmei/Popular-Rules-Collection/commits/main" \
            | python -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          echo "$SHA" > /tmp/collection/commit.sha
          curl -fsSL \
            "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/${SHA}/rule/_index.yaml" \
            -o /tmp/collection/_index.yaml
          wc -c /tmp/collection/_index.yaml
          echo "resolved Collection SHA=$SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Full identity freshness compare
        id: compare
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import yaml

          snap_path = Path("config/collection_identity_snapshot.json")
          if not snap_path.is_file():
              raise SystemExit("missing config/collection_identity_snapshot.json")

          snap = json.loads(snap_path.read_text(encoding="utf-8"))
          raw = Path("/tmp/collection/_index.yaml").read_bytes()
          index = yaml.safe_load(raw.decode("utf-8"))
          live_sha = Path("/tmp/collection/commit.sha").read_text(encoding="utf-8").strip()
          live_file_sha256 = hashlib.sha256(raw).hexdigest()

          if not isinstance(index, dict) or not isinstance(index.get("entries"), list):
              raise SystemExit("Collection index missing entries[]")

          live = {}
          for item in index["entries"]:
              if not isinstance(item, dict):
                  continue
              if str(item.get("entity") or "service").lower() != "service":
                  continue
              sid = item.get("id") or item.get("service_id")
              if sid is None or str(sid).strip() == "":
                  continue
              sid = str(sid)
              live[sid] = {
                  "id": sid,
                  "display_name": str(item.get("display_name") or sid),
                  "provider": str(item.get("provider") or ""),
              }

          if len(live) < 10:
              raise SystemExit(f"too few live services: {len(live)}")

          pinned_raw = snap.get("services") or {}
          pinned = {}
          if isinstance(pinned_raw, dict):
              for k, v in pinned_raw.items():
                  sid = str(k)
                  if isinstance(v, dict):
                      pinned[sid] = {
                          "id": sid,
                          "display_name": str(v.get("display_name") or sid),
                          "provider": str(v.get("provider") or ""),
                      }
                  else:
                      pinned[sid] = {"id": sid, "display_name": sid, "provider": ""}

          only_live = sorted(set(live) - set(pinned))
          only_pin = sorted(set(pinned) - set(live))
          field_mismatches = []
          for sid in sorted(set(live) & set(pinned)):
              a, b = live[sid], pinned[sid]
              for field in ("display_name", "provider"):
                  if a.get(field) != b.get(field):
                      field_mismatches.append({
                          "service_id": sid,
                          "field": field,
                          "live": a.get(field),
                          "pinned": b.get(field),
                      })
                      if len(field_mismatches) >= 50:
                          break
              if len(field_mismatches) >= 50:
                  break

          pinned_src = snap.get("source") if isinstance(snap.get("source"), dict) else {}
          pinned_ref = str((pinned_src or {}).get("ref") or "")
          # Prefer explicit file_sha256; fall back to file_sha (transition alias for SHA-256)
          pinned_file_sha256 = str((pinned_src or {}).get("file_sha256") or (pinned_src or {}).get("file_sha") or "")

          # P1-01: drift is content-based. Collection HEAD moves without _index.yaml
          # change must NOT force refresh (docs/status/backup commits).
          # Hash comparison uses SHA-256 of content only.
          drift = False
          drift_reasons = []
          if only_live or only_pin:
              drift = True
              drift_reasons.append("service_id_set")
          if field_mismatches:
              drift = True
              drift_reasons.append("display_name_or_provider")
          if pinned_file_sha256:
              if pinned_file_sha256 != live_file_sha256:
                  drift = True
                  drift_reasons.append("file_sha256_mismatch")
          else:
              # Legacy snapshot without any content hash: require one refresh to pin content
              drift = True
              drift_reasons.append("file_sha256_missing_in_snapshot")

          head_ahead = bool(pinned_ref and pinned_ref not in ("main", live_sha))
          # Informational only when content matches
          content_match = (not only_live and not only_pin and not field_mismatches
                           and pinned_file_sha256 and pinned_file_sha256 == live_file_sha256)

          report = {
              "schema": "icon_identity_freshness_v4",
              "live_collection_sha": live_sha,
              "live_file_sha256": live_file_sha256,
              "pinned_ref": pinned_ref,
              "pinned_file_sha256": pinned_file_sha256,
              "pinned_generated_at": snap.get("generated_at"),
              "live_service_count": len(live),
              "pinned_service_count": len(pinned),
              "only_in_collection": only_live[:50],
              "only_in_snapshot": only_pin[:50],
              "field_mismatches": field_mismatches[:50],
              "collection_head_ahead_of_pin": head_ahead,
              "content_match": content_match,
              "drift_reasons": drift_reasons,
              "drift": drift,
              "note": "Drift uses identity content (ids/fields/file_sha256). Collection HEAD alone does not imply drift. file_sha is treated as transition alias for file_sha256.",
          }
          Path("reports").mkdir(parents=True, exist_ok=True)
          Path("reports/identity_freshness.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"drift={'true' if drift else 'false'}\n")
              # When remediating, pin to current HEAD (still correct for that content)
              fh.write(f"collection_sha={live_sha}\n")

          print("DRIFT" if drift else "NO DRIFT")
          if head_ahead and content_match:
              print("INFO: Collection HEAD moved but rule/_index.yaml content matches pin — no refresh")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: identity-freshness-report
          path: reports/identity_freshness.json
          if-no-files-found: warn

  sync-pr:
    name: Remediate drift (regenerate + PR)
    needs: compare
    if: needs.compare.outputs.drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Regenerate snapshot at exact Collection SHA
        run: |
          python scripts/sync_collection_identity_snapshot.py \
            --commit-sha "${{ needs.compare.outputs.collection_sha }}"

      - name: Create branch and PR (fail if cannot remediate)
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_SHA: ${{ needs.compare.outputs.collection_sha }}
        run: |
          set -euo pipefail
          BRANCH="automation/identity-snapshot-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add config/collection_identity_snapshot.json
          if git diff --cached --quiet; then
            echo "::error::Drift reported but snapshot unchanged after sync"
            exit 1
          fi
          git commit -m "chore(icon): refresh collection identity snapshot (freshness drift)"
          git push --set-upstream origin "$BRANCH"

          BODY="Automated Identity Freshness reconcile (run ${GITHUB_RUN_ID}). Content pin Collection SHA ${COLLECTION_SHA} (file_sha256 based)."
          set +e
          PR_OUT=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(icon): refresh collection identity snapshot" \
            --body "$BODY" 2>&1)
          STATUS=$?
          set -e
          echo "$PR_OUT"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$PR_OUT" | grep -qiE 'already exists'; then
              echo "PR already exists for branch"
            elif echo "$PR_OUT" | grep -qiE 'not permitted to create or approve pull requests|createPullRequest'; then
              echo "::error::Branch pushed; PR blocked by policy. Open PR from $BRANCH manually."
              exit 1
            else
              exit "$STATUS"
            fi
          fi
          # A newly created PR may briefly report "no checks reported" while
          # GitHub is still creating pull_request check runs. Require both real
          # gates to appear before watching them; never interpret an empty list as
          # success and never merge based on only one of the two checks.
          CHECKS_JSON=""
          CHECKS_READY=false
          for attempt in $(seq 1 36); do
            set +e
            CHECKS_JSON=$(gh pr checks "$BRANCH" --repo "${{ github.repository }}" --json name,state,link 2>/dev/null)
            CHECKS_RC=$?
            set -e
            if [ "$CHECKS_RC" -eq 0 ] && printf '%s' "$CHECKS_JSON" | python -c '
          import json, sys
          try:
              rows = json.load(sys.stdin)
              names = {str(row.get("name") or "").strip().lower() for row in rows}
              ok = {"l0-l1", "verify"}.issubset(names)
          except Exception:
              ok = False
          sys.exit(0 if ok else 1)
          '; then
              CHECKS_READY=true
              echo "Both PR CI (l0-l1) and V6 Manifest Verification (verify) are registered."
              break
            fi
            echo "Waiting for both required check runs to register (attempt ${attempt}/36)..."
            sleep 5
          done
          if [ "$CHECKS_READY" != "true" ]; then
            echo "::error::Both required checks did not register within 180 seconds. Leaving PR open; refusing unsafe merge."
            printf '%s\n' "$CHECKS_JSON"
            exit 1
          fi

          set +e
          gh pr checks "$BRANCH" --repo "${{ github.repository }}" --watch
          CHECK_STATUS=$?
          set -e
          if [ "$CHECK_STATUS" -ne 0 ]; then
            echo "::error::One or more PR checks failed. Leaving PR open for diagnosis; refusing unsafe merge."
            exit 1
          fi

          gh pr merge "$BRANCH" --repo "${{ github.repository }}" --squash --delete-branch
          echo "Identity snapshot PR merged only after both required checks passed."
