name: Identity Freshness

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  compare:
    name: Compare Collection identity vs pinned snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.compare.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch Collection rule/_index.yaml
        run: |
          mkdir -p /tmp/collection
          curl -fsSL \
            "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Collection/main/rule/_index.yaml" \
            -o /tmp/collection/_index.yaml
          wc -c /tmp/collection/_index.yaml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Freshness compare
        id: compare
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml

          snap_path = Path("config/collection_identity_snapshot.json")
          if not snap_path.is_file():
              raise SystemExit("missing config/collection_identity_snapshot.json")

          snap = json.loads(snap_path.read_text(encoding="utf-8"))
          index = yaml.safe_load(Path("/tmp/collection/_index.yaml").read_text(encoding="utf-8"))
          if not isinstance(index, dict):
              raise SystemExit(f"unexpected index type: {type(index).__name__}")

          live_ids = set()
          entries = index.get("entries")
          if isinstance(entries, list):
              for item in entries:
                  if not isinstance(item, dict):
                      continue
                  ent = str(item.get("entity") or "service").lower()
                  if ent != "service":
                      continue
                  sid = item.get("id") or item.get("service_id")
                  if sid is not None and str(sid).strip() != "":
                      live_ids.add(str(sid))
          else:
              raise SystemExit("Collection index has no entries[] — refuse ambiguous parse")

          if len(live_ids) < 10:
              raise SystemExit(f"parsed too few live service ids: {len(live_ids)}")

          pinned = snap.get("services") or {}
          if isinstance(pinned, dict):
              pinned_ids = set(str(k) for k in pinned.keys())
          elif isinstance(pinned, list):
              pinned_ids = set(str(x) for x in pinned)
          else:
              pinned_ids = set()

          only_live = sorted(live_ids - pinned_ids)
          only_pin = sorted(pinned_ids - live_ids)
          drift = bool(only_live or only_pin)

          report = {
              "schema": "icon_identity_freshness_v1",
              "index_schema": index.get("schema"),
              "index_run_id": index.get("run_id"),
              "pinned_generated_at": snap.get("generated_at"),
              "live_service_count": len(live_ids),
              "pinned_service_count": len(pinned_ids),
              "only_in_collection": only_live[:50],
              "only_in_snapshot": only_pin[:50],
              "drift": drift,
          }
          out = Path("reports")
          out.mkdir(parents=True, exist_ok=True)
          (out / "identity_freshness.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"drift={'true' if drift else 'false'}\n")

          print("DRIFT" if drift else "NO DRIFT")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: identity-freshness-report
          path: reports/identity_freshness.json
          if-no-files-found: warn

  sync-pr:
    name: Open snapshot sync PR when drift
    needs: compare
    if: needs.compare.outputs.drift == 'true'
    runs-on: ubuntu-latest
    # Soft path: branch push / PR policy must not fail the freshness contract itself
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Regenerate collection identity snapshot
        run: python scripts/sync_collection_identity_snapshot.py

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/identity-snapshot-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add config/collection_identity_snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot file unchanged after sync"
            exit 0
          fi
          git commit -m "chore(icon): refresh collection identity snapshot (freshness drift)"
          git push --set-upstream origin "$BRANCH" || {
            echo "::warning::push failed"
            exit 0
          }

          set +e
          PR_OUT=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(icon): refresh collection identity snapshot" \
            --body "Automated Identity Freshness reconcile (run ${GITHUB_RUN_ID})." 2>&1)
          echo "$PR_OUT"
          exit 0
