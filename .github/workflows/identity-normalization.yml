name: Identity Registry Normalization

on:
  push:
    branches:
      - feat/identity-boundary-v3-20260930
  pull_request:

concurrency:
  group: identity-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'

      - name: Normalize canonical registry metadata
        run: |
          set -euo pipefail
          mkdir -p build
          python scripts/normalize_registry_identity.py             --apply             --report build/identity-normalization-report.json

      - name: Create/update normalization PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/identity-normalize-20260930
          git add registry/services
          if git diff --cached --quiet; then
            echo "No canonical registry identity changes"
            exit 0
          fi
          git commit -m "fix(identity): normalize registry metadata from Collection"
          git push --force-with-lease origin automation/identity-normalize-20260930
          echo "Normalization branch updated; review/merge the generated branch separately."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: identity-normalization-${{ github.sha }}
          path: build/identity-normalization-report.json
          if-no-files-found: warn
          retention-days: 30
