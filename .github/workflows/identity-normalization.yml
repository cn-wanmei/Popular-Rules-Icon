name: Identity Registry Normalization

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply canonical service identity fields to registry/services and prepare an automation branch.
        required: true
        default: false
        type: boolean

concurrency:
  group: identity-normalize-manual
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'

      - name: Normalize canonical registry metadata
        run: |
          set -euo pipefail
          mkdir -p build
          APPLY_ARG=""
          if [ "${{ inputs.apply }}" = "true" ]; then APPLY_ARG="--apply"; fi
          python scripts/normalize_registry_identity.py             $APPLY_ARG             --report build/identity-normalization-report.json

      - name: Publish reviewed normalization branch
        if: ${{ inputs.apply == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/identity-normalize-20260930
          git add registry/services
          if git diff --cached --quiet; then
            echo "No canonical registry identity changes"
            exit 0
          fi
          git commit -m "fix(identity): normalize registry metadata from Collection"
          git push --force origin HEAD:refs/heads/automation/identity-normalize-20260930
          echo "Reviewed normalization branch updated."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: identity-normalization-${{ github.run_id }}
          path: build/identity-normalization-report.json
          if-no-files-found: warn
          retention-days: 30
