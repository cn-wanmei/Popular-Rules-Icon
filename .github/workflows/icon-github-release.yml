name: Icon Style GitHub Release Packages

# Manual-only packaging of 8 style icon zips + GitHub Release.
# NEVER triggered by push / V6 Release Writer / schedule.
# Run from Actions after a successful dist publish when you want user-facing zips.
#
# P1-04 (audit 2026-10-09): User release tags are IMMUTABLE.
# Existing same-tag Release must cause the job to fail; never delete/overwrite.

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Immutable V6 release id (must already exist under dist/manifests/)"
        required: true
        type: string
      prev_release_id:
        description: "Previous production release id for changelog diff (optional)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "If true, only package, do not create GitHub Release"
        required: false
        type: boolean
        default: false

concurrency:
  group: icon-github-release
  cancel-in-progress: false


jobs:
  package-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Fetch dist branch (manifests + v objects)
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/dist:refs/remotes/origin/dist
          mkdir -p build/dist-manifests build/objects
          git show "refs/remotes/origin/dist:manifests/${{ inputs.release_id }}.json" > "build/dist-manifests/${{ inputs.release_id }}.json"
          git archive refs/remotes/origin/dist v | tar -x -C build/objects
          mkdir -p build/v
          if [ -d build/objects/v ]; then
            cp -a build/objects/v/. build/v/ || true
          fi
          echo "png count: $(find build -name '*.png' | wc -l)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Resolve previous manifest (optional)
        id: prev
        run: |
          set -euo pipefail
          PREV="${{ inputs.prev_release_id }}"
          if [ -n "$PREV" ]; then
            if git show "refs/remotes/origin/dist:manifests/${PREV}.json" > "build/dist-manifests/${PREV}.json" 2>/dev/null; then
              echo "path=build/dist-manifests/${PREV}.json" >> "$GITHUB_OUTPUT"
              echo "id=$PREV" >> "$GITHUB_OUTPUT"
            else
              echo "path=" >> "$GITHUB_OUTPUT"
              echo "id=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Package 8 style zips
        run: |
          set -euo pipefail
          ARGS=(
            --manifest "build/dist-manifests/${{ inputs.release_id }}.json"
            --release-id "${{ inputs.release_id }}"
            --out-dir release-packages
            --objects-root build/objects
            --objects-root build/v
            --objects-root build
          )
          if [ -n "${{ steps.prev.outputs.path }}" ]; then
            ARGS+=(--prev-manifest "${{ steps.prev.outputs.path }}" --prev-release-id "${{ steps.prev.outputs.id }}")
          fi
          python scripts/package_style_releases.py "${ARGS[@]}"
          ls -la release-packages/

      - name: Upload package artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: icon-style-packages-${{ inputs.release_id }}
          path: release-packages/
          if-no-files-found: error
          retention-days: 30

      - name: Fail if same-tag Release already exists (immutable)
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RID="${{ inputs.release_id }}"
          if gh release view "$RID" >/dev/null 2>&1; then
            echo "::error::Release tag $RID already exists. User releases are immutable (P1-04). Publish a new unique release_id instead of overwriting."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$RID" | grep -q "$RID"; then
            echo "::error::Git tag $RID already exists on origin. User releases are immutable (P1-04)."
            exit 1
          fi
          echo "Tag $RID is free; proceeding to create immutable release."

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set -f
          RID="${{ inputs.release_id }}"
          ASSET_ARGS=()
          while IFS= read -r -d '' f; do
            ASSET_ARGS+=("$f")
          done < <(find release-packages -maxdepth 1 -type f \
            \( -name '*.zip' -o -name 'RELEASE_NOTES.md' -o -name 'SHA256SUMS.txt' -o -name 'release-meta.json' \) \
            -print0 | sort -z)
          test "${#ASSET_ARGS[@]}" -ge 8
          gh release create "$RID" \
            --title "Icon System V6 — ${RID}" \
            --notes-file release-packages/RELEASE_NOTES.md \
            "${ASSET_ARGS[@]}"
          echo "Created immutable icon release: $RID"
