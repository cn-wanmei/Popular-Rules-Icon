name: V6 Manifest Verification

on:
  pull_request:
    paths:
      - 'config/collection_identity_snapshot.json'
      - 'config/release-pointers.yaml'
      - 'config/variant-policy.yaml'
      - 'scripts/v6_manifest_gate.py'
      - '.github/workflows/v6-manifest-gate.yml'
  workflow_dispatch:
    inputs:
      strict:
        description: Fail when canonical coverage/orphan/path drift exists
        required: false
        default: false
        type: boolean

concurrency:
  group: v6-manifest-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          cache: pip
          cache: pip

      - run: python -m pip install -e ".[dev]"

      - name: Read configured V6 release
        id: release
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          from pathlib import Path
          cfg = yaml.safe_load(Path("config/release-pointers.yaml").read_text(encoding="utf-8"))
          print(f"release={cfg['production']}")
          PY

      - name: Fetch immutable dist manifest
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fsSL             "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Icon/dist/manifests/${{ steps.release.outputs.release }}.json"             -o build/v6-manifest.json

      - name: V6 manifest gate
        run: |
          set -euo pipefail
          STRICT_ARG=""
          if [ "${{ inputs.strict }}" = "true" ]; then STRICT_ARG="--strict"; fi
          python scripts/v6_manifest_gate.py             --manifest build/v6-manifest.json             --snapshot config/collection_identity_snapshot.json             --release-id "${{ steps.release.outputs.release }}"             $STRICT_ARG | tee build/v6-manifest-gate.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v6-manifest-gate-${{ github.sha }}
          path: build/v6-manifest-gate.json
          if-no-files-found: warn
          retention-days: 30
