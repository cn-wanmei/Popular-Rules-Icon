name: Icon V6 Freeze Expiry Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/release-pointers.yaml"
      - "scripts/freeze_expiry_monitor.py"
      - ".github/workflows/freeze-expiry-monitor.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: icon-v6-freeze-expiry-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Calculate freeze alert
        id: alert
        run: python scripts/freeze_expiry_monitor.py --github-output "$GITHUB_OUTPUT"

      - name: Comment once per freeze threshold
        if: steps.alert.outputs.alert != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT: ${{ steps.alert.outputs.alert }}
          FREEZE_ID: ${{ steps.alert.outputs.freeze_id }}
          EXPIRES_AT: ${{ steps.alert.outputs.freeze_expires_at }}
          DAYS_LEFT: ${{ steps.alert.outputs.days_left }}
          MARKER: ${{ steps.alert.outputs.marker }}
        run: |
          set -euo pipefail
          COMMENTS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/43/comments" --jq '.[].body')"
          if grep -Fq "$MARKER" <<< "$COMMENTS"; then
            echo "Reminder already recorded: $MARKER"
            exit 0
          fi
          case "$ALERT" in
            7d) TITLE="7-day reminder";;
            3d) TITLE="3-day reminder";;
            24h) TITLE="24-hour reminder";;
            expired) TITLE="Freeze expired — production pointer changes remain blocked";;
            *) exit 0;;
          esac
          gh issue comment 43 --body "$MARKER
          Icon V6 freeze alert: $TITLE

          Freeze ID: $FREEZE_ID
          Expires at: $EXPIRES_AT
          Days remaining: $DAYS_LEFT

          Please record an explicit unfreeze or extension decision in Issue #43. No automatic unfreeze or production pointer change is performed."
