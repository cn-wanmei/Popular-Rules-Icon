name: V6 Release Writer

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release id, e.g. icon-2026.09.30.r15
        required: true
      state_ref:
        description: Exact state branch or ref
        required: false
        default: "state"
      state_sha:
        description: Exact commit on the state ref. Empty = state ref head.
        required: false
        default: ""
      confirm:
        description: Use "publish" to write the verified manifest and new objects to dist.
        required: true
        default: "dry-run"
  push:
    branches:
      - release-clean-v1

concurrency:
  group: v6-release-writer
  cancel-in-progress: false

jobs:
  build-and-gate:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.params.outputs.release }}
      publish: ${{ steps.params.outputs.publish }}
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Resolve release parameters
        id: params
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            RELEASE=$(awk '/^release_id:/ {print $2}' config/clean-release-candidate.yaml)
            STATE_REF=$(awk '/^state_ref:/ {print $2}' config/clean-release-candidate.yaml)
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            RELEASE="${{ inputs.release_id }}"
            STATE_REF="${{ inputs.state_ref }}"
            [ -n "$STATE_REF" ] || STATE_REF="state"
            if [ "${{ inputs.confirm }}" = "publish" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "state_ref=$STATE_REF" >> "$GITHUB_OUTPUT"

      - name: Resolve exact state commit
        id: state
        run: |
          set -euo pipefail
          STATE_REF="${{ steps.params.outputs.state_ref }}"
          git fetch --no-tags origin "refs/heads/$STATE_REF:refs/remotes/origin/release-state"
          STATE_SHA="${{ inputs.state_sha }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ -z "$STATE_SHA" ]; then
            STATE_SHA="$(git rev-parse refs/remotes/origin/release-state)"
          fi
          git cat-file -e "$STATE_SHA^{commit}"
          echo "sha=$STATE_SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$STATE_REF" >> "$GITHUB_OUTPUT"
          git show -s --format='%H %s' "$STATE_SHA"

      - name: Materialize exact state snapshot
        run: |
          set -euo pipefail
          rm -rf build/state build/objects build/materialized-state
          mkdir -p build/state
          git archive "${{ steps.state.outputs.sha }}" services | tar -x -C build/state --strip-components=1
          test -d build/state

      - name: Build canonical V6 release
        run: |
          set -euo pipefail
          python scripts/build_release_from_state.py             --state-dir build/state             --snapshot config/collection_identity_snapshot.json             --release-id "${{ steps.params.outputs.release }}"             --out "build/${{ steps.params.outputs.release }}.json"             --seed-dir assets/icons/seed             --objects-out build/objects             --materialized-state-dir build/materialized-state             --allow-seed-bootstrap

      - name: Verify exact dist object closure
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/dist:refs/remotes/origin/dist
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path("build/${{ steps.params.outputs.release }}.json").read_text(encoding="utf-8"))
          dist_paths = set(subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", "refs/remotes/origin/dist"],
              text=True,
          ).splitlines())
          new_paths = set(str(p.relative_to("build/objects")) for p in Path("build/objects").rglob("*.png"))
          missing = []
          bad_local = []
          for entry in manifest.get("entries", []):
              for meta in (entry.get("variants") or {}).values():
                  path = meta.get("path", "").lstrip("/")
                  if not path:
                      missing.append("<empty>")
                  elif path not in dist_paths and path not in new_paths:
                      missing.append(path)
          for p in Path("build/objects").rglob("*.png"):
              if p.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  bad_local.append(str(p))
          if missing or bad_local:
              print("missing dist objects:", len(missing))
              print("\n".join(missing[:50]))
              print("bad local PNGs:", len(bad_local))
              print("\n".join(bad_local[:20]))
              raise SystemExit(2)
          print("dist object closure: PASS")
          print("new object files:", len(new_paths))
          PY

      - name: Strict V6 manifest gate
        run: |
          set -euo pipefail
          python scripts/v6_manifest_gate.py             --manifest "build/${{ steps.params.outputs.release }}.json"             --snapshot config/collection_identity_snapshot.json             --release-id "${{ steps.params.outputs.release }}"             --strict

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v6-release-candidate-${{ steps.params.outputs.release }}
          path: |
            build/${{ steps.params.outputs.release }}.json
            build/objects
            build/materialized-state
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-and-gate
    if: needs.build-and-gate.result == 'success' && needs.build-and-gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: v6-release-candidate-${{ needs.build-and-gate.outputs.release }}
          path: build

      - name: Publish immutable manifest and physical objects to dist
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/dist:refs/remotes/origin/dist
          if git show "refs/remotes/origin/dist:manifests/${{ needs.build-and-gate.outputs.release }}.json" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 3
          fi
          git switch --detach "refs/remotes/origin/dist"
          mkdir -p v manifests
          if [ -d build/objects/v ]; then
            while IFS= read -r -d '' src; do
              rel="${src#build/objects/}"
              dest="$rel"
              if git cat-file -e "HEAD:$dest" 2>/dev/null; then
                if ! cmp -s "$src" <(git show "HEAD:$dest"); then
                  echo "existing physical object differs: $dest"
                  exit 4
                fi
              else
                mkdir -p "$(dirname "$dest")"
                cp "$src" "$dest"
              fi
            done < <(find build/objects -type f -name '*.png' -print0)
          fi
          cp "build/${{ needs.build-and-gate.outputs.release }}.json" "manifests/${{ needs.build-and-gate.outputs.release }}.json"
          git add v manifests
          git commit -m "release: publish ${{ needs.build-and-gate.outputs.release }}"
          git push origin "HEAD:refs/heads/dist"

      - name: Publish summary
        run: |
          echo "Published immutable V6 release: ${{ needs.build-and-gate.outputs.release }}"
          echo "Production pointer must be updated via reviewed PR."
