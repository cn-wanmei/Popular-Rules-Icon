name: V6 Release Writer

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release id, e.g. icon-2026.09.30.r15
        required: true
      state_sha:
        description: Exact commit on the state branch. Empty = current state branch head.
        required: false
        default: ""
      confirm:
        description: Use "publish" to write the verified manifest to dist.
        required: true
        default: "dry-run"

concurrency:
  group: v6-release-writer
  cancel-in-progress: false

jobs:
  build-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Resolve exact state commit
        id: state
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/state:refs/remotes/origin/state
          STATE_SHA="${{ inputs.state_sha }}"
          if [ -z "$STATE_SHA" ]; then
            STATE_SHA="$(git rev-parse refs/remotes/origin/state)"
          fi
          git cat-file -e "$STATE_SHA^{commit}"
          echo "sha=$STATE_SHA" >> "$GITHUB_OUTPUT"
          git show -s --format='%H %s' "$STATE_SHA"

      - name: Materialize exact state snapshot
        run: |
          set -euo pipefail
          mkdir -p build/state
          git archive "${{ steps.state.outputs.sha }}" services | tar -x -C build/state --strip-components=1
          test -d build/state

      - name: Fail-closed release writer
        run: |
          set -euo pipefail
          python scripts/build_release_from_state.py             --state-dir build/state             --snapshot config/collection_identity_snapshot.json             --release-id "${{ inputs.release_id }}"             --out "build/${{ inputs.release_id }}.json"

      - name: Verify exact dist object closure
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/dist:refs/remotes/origin/dist
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path("build/${{ inputs.release_id }}.json").read_text(encoding="utf-8"))
          dist_paths = set(
              subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", "refs/remotes/origin/dist"],
                  text=True,
              ).splitlines()
          )
          missing = []
          for entry in manifest.get("entries", []):
              for meta in (entry.get("variants") or {}).values():
                  path = meta.get("path", "").lstrip("/")
                  if path and path not in dist_paths:
                      missing.append(path)
          if missing:
              print("missing dist objects:", len(missing))
              print("\n".join(missing[:50]))
              raise SystemExit(2)
          print("dist object closure: PASS")
          PY

      - name: Strict V6 manifest gate
        run: |
          set -euo pipefail
          python scripts/v6_manifest_gate.py             --manifest "build/${{ inputs.release_id }}.json"             --snapshot config/collection_identity_snapshot.json             --release-id "${{ inputs.release_id }}"             --strict

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v6-release-candidate-${{ inputs.release_id }}
          path: build/${{ inputs.release_id }}.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-and-gate
    if: ${{ inputs.confirm == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: v6-release-candidate-${{ inputs.release_id }}
          path: build

      - name: Publish immutable manifest to dist
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/dist:refs/remotes/origin/dist
          if git show "refs/remotes/origin/dist:manifests/${{ inputs.release_id }}.json" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 3
          fi

          git switch --detach "refs/remotes/origin/dist"
          mkdir -p manifests
          cp "build/${{ inputs.release_id }}.json" "manifests/${{ inputs.release_id }}.json"
          git add "manifests/${{ inputs.release_id }}.json"
          git commit -m "release: publish ${{ inputs.release_id }}"
          git push origin "HEAD:refs/heads/dist"

      - name: Summary
        run: |
          echo "Published immutable V6 manifest: ${{ inputs.release_id }}"
          echo "Main production pointer is NOT changed by this workflow."
          echo "Update config/release-pointers.yaml through a reviewed PR after publication."
