name: PR CI (L0–L1)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l0-l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install pillow pytest
      - name: L0 schemas + L1 unit tests
        run: python -m pytest -q
      - name: Registry presence
        run: python -m popular_rules_icon.cli validate-registry
      - name: Identity boundary gate (strict)
        run: |
          test -f scripts/identity_boundary_gate.py || { echo "missing identity_boundary_gate.py"; exit 1; }
          test -f config/collection_identity_snapshot.json || { echo "missing Collection identity snapshot"; exit 1; }
          python scripts/identity_boundary_gate.py --write-report build/identity-boundary-report.json --strict

      - name: V6 manifest verification (strict)
        run: |
          set -euo pipefail
          mkdir -p build
          RELEASE=$(awk '/^production:/ {print $2}' config/release-pointers.yaml)
          curl -fsSL "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Icon/dist/manifests/$RELEASE.json" -o "build/$RELEASE.json"
          python scripts/v6_manifest_gate.py             --manifest "build/$RELEASE.json"             --snapshot config/collection_identity_snapshot.json             --release-id "$RELEASE"             --strict | tee build/v6-manifest-report.json

      - name: Production icon visual identity audit
        run: |
          set -euo pipefail
          RELEASE=$(awk '/^production:/ {print $2}' config/release-pointers.yaml)
          python scripts/icon_visual_identity_gate.py             --manifest "build/$RELEASE.json"             --registry registry/services             --write-report build/icon-visual-identity-report.json

      - name: Style compatibility policy audit
        run: |
          set -euo pipefail
          test -f config/style-compatibility.yaml
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("config/icon-demand.yaml").read_text(encoding="utf-8")
          before, sep, after = text.partition("experimental:")
          assert sep, "missing experimental style section"
          default_block = re.search(r"defaults:\n(.*?)(?=\nclients:)", text, re.S)
          assert default_block, "missing defaults block"
          rich_block = re.search(r"clients:\n(.*?)(?=\nexperimental:)", text, re.S)
          assert rich_block, "missing clients block"
          assert re.search(r"^\s+- y2k\s*$", default_block.group(1), re.M) is None, "y2k must not be a default demand style"
          assert re.search(r"^\s+- y2k\s*$", rich_block.group(1), re.M) is None, "y2k must not be a rich default demand style"
          assert re.search(r"experimental:\n[\s\S]*^\s+- y2k\s*$", text, re.M), "y2k must remain explicitly discoverable as experimental"
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: icon-visual-audit-${{ github.sha }}
          path: |
            build/identity-boundary-report.json
            build/v6-manifest-report.json
            build/icon-visual-identity-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: R10 Freeze coverage gate (seeds)
        run: |
          test -f scripts/freeze_coverage_gate.py || { echo "missing freeze_coverage_gate.py — commit scripts with workflow"; exit 1; }
          python scripts/freeze_coverage_gate.py --registry registry/services --seed assets/icons/seed
      - name: R12 Metrics
        run: |
          test -f scripts/icon_metrics.py || { echo "missing icon_metrics.py"; exit 1; }
          python scripts/icon_metrics.py
