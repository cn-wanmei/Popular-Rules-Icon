name: PR CI (L0–L1)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l0-l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install pillow pytest
      - name: L0 schemas + L1 unit tests
        run: python -m pytest -q
      - name: Registry presence
        run: python -m popular_rules_icon.cli validate-registry
      - name: Identity boundary gate (strict)
        run: |
          test -f scripts/identity_boundary_gate.py || { echo "missing identity_boundary_gate.py"; exit 1; }
          test -f config/collection_identity_snapshot.json || { echo "missing Collection identity snapshot"; exit 1; }
          python scripts/identity_boundary_gate.py --write-report build/identity-boundary-report.json --strict --strict

      - name: V6 manifest verification (strict)
        run: |
          set -euo pipefail
          mkdir -p build
          RELEASE=$(awk '/^production:/ {print $2}' config/release-pointers.yaml
          )
          curl -fsSL "https://raw.githubusercontent.com/cn-wanmei/Popular-Rules-Icon/dist/manifests/$RELEASE.json" -o "build/$RELEASE.json"
          python scripts/v6_manifest_gate.py             --manifest "build/$RELEASE.json"             --snapshot config/collection_identity_snapshot.json             --release-id "$RELEASE"             --strict | tee build/v6-manifest-report.json

      - name: R10 Freeze coverage gate (seeds)
        run: |
          test -f scripts/freeze_coverage_gate.py || { echo "missing freeze_coverage_gate.py — commit scripts with workflow"; exit 1; }
          python scripts/freeze_coverage_gate.py --registry registry/services --seed assets/icons/seed
      - name: R12 Metrics
        run: |
          test -f scripts/icon_metrics.py || { echo "missing icon_metrics.py"; exit 1; }
          python scripts/icon_metrics.py
