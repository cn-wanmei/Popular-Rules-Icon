name: PR CI (L0–L1)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l0-l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install pillow pytest
      - name: L0 schemas + L1 unit tests
        run: python -m pytest -q
      - name: Registry presence
        run: python -m popular_rules_icon.cli validate-registry
      - name: R10 Freeze coverage gate (seeds)
        run: python scripts/freeze_coverage_gate.py --registry registry/services --seed assets/icons/seed
      - name: R12 Metrics
        run: python scripts/icon_metrics.py
